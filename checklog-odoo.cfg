[checklog-odoo]
ignore=
    WARNING.* 0 failed, 0 error\(s\).*
    WARNING.*tax account\.1_tax_template.* not found.*
    WARNING.*Using active_id, active_ids and active_model in expressions is deprecated.*
    WARNING.*Attachment indexation of PDF documents is unavailable.*
    WARNING.*Rule access_hr_contract_.* has no group.*
    WARNING.*Property wizard\.workalendar\.holiday\.import\.start_date\.readonly should be a boolean.*
    WARNING.*Field stock\.move\..* cannot be precomputed as it depends on non-precomputed field stock\.move\.\w+.*
    WARNING.*Field hr\.payslip\.line\..*: unknown parameter 'digits'.*
