exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  ^account_payment_currency_rate/|
  ^account_statement_import_ofx_invert_type/|
  ^base_wip/|
  ^crm_bant/|
  ^crm_linkedin/|
  ^crm_lost_reason_transition/|
  ^crm_predict_revenue/|
  ^crm_stage_role_responsible/|
  ^crm_wip/|
  ^helpdesk_date_range/|
  ^helpdesk_mgmt_index_content/|
  ^helpdesk_mgmt_sla_formula/|
  ^helpdesk_mgmt_sla_safety/|
  ^helpdesk_mgmt_ticket_life_cycle/|
  ^hr_holidays_allocation_plan/|
  ^hr_holidays_no_mail/|
  ^hr_holidays_plan_next_year/|
  ^hr_holidays_required_support_document/|
  ^hr_holidays_sale_of_days_off/|
  ^hr_leave_allocation_multiple_tags/|
  ^hr_leave_custom_hour_interval_5_min/|
  ^hr_overtime_report_action_pdf/|
  ^hr_recruitment_job_share/|
  ^hr_recruitment_reject_mail_editable/|
  ^hr_work_entry_holidays_natural_period/|
  ^l10n_br_account_statement_import_txt_xlsx/|
  ^l10n_br_cnpj_search_minha_receita/|
  ^l10n_br_hr_holidays_public/|
  ^l10n_br_hr_overtime_custom_multiplier/|
  ^l10n_br_hr_recruitment/|
  ^l10n_br_payment_boleto/|
  ^l10n_br_payment_boleto_pinbank/|
  ^l10n_br_sale_report_py3o/|
  ^l10n_br_stock_report_py3o/|
  ^l10n_br_website_hr_recruitment_form/|
  ^mail_no_reply/|
  ^mail_role_filter/|
  ^partner_customer_rating/|
  ^partner_display_name_ref/|
  ^partner_linkedin/|
  ^partner_tier/|
  ^product_contract_payment_mode/|
  ^product_contract_period/|
  ^product_contract_period_bo/|
  ^project_task_service_class/|
  ^project_tech_lead/|
  ^sale_blanket_order_isolated_quotation/|
  ^sale_crm_auto_won/|
  ^sale_exception_quotation/|
  ^sale_hide_internal_reference/|
  ^sale_order_template_pricelist/|
  ^sale_partial_lock/|
  ^sale_report_merge_pdf/|
  ^sale_tier_validation_exceptions/|
  ^sale_timesheet_invoice_from_project/|
  ^stock_intercompany_bidirectional_pull/|
  ^stock_picking_reports_declaration/|
  ^website_hr_recruitment_display_description/|
  # END NOT INSTALLABLE ADDONS
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^.github/|^eslint.config.cjs|^prettier.config.cjs|
  # Maybe reactivate this when all README files include prettier ignore tags?
  ^README\.md$|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  # Repos using Sphinx to generate docs don't need prettying
  ^docs/_templates/.*\.html$|
  # Don't bother non-technical authors with formatting issues in docs
  readme/.*\.(rst|md)$|
  # Ignore build and dist directories in addons
  /build/|/dist/|
  # Ignore test files in addons
  /tests/samples/.*|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)
default_language_version:
  python: python3
  node: "22.9.0"
repos:
  - repo: local
    hooks:
      # These files are most likely copier diff rejection junks; if found,
      # review them manually, fix the problem (if needed) and remove them
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: "\\.rej$"
      - id: en-po-files
        name: en.po files cannot exist
        entry: found a en.po file
        language: fail
        files: '[a-zA-Z0-9_]*/i18n/en\.po$'
  - repo: https://github.com/oca/maintainer-tools
    rev: bf9ecb9938b6a5deca0ff3d870fbd3f33341fded
    hooks:
      # update the NOT INSTALLABLE ADDONS section above
      - id: oca-update-pre-commit-excluded-addons
      - id: oca-fix-manifest-website
        args: ["https://github.com/KMEE/kmee-odoo-addons"]
      - id: oca-gen-addon-readme
        args:
          - --addons-dir=.
          - --branch=18.0
          - --org-name=KMEE
          - --repo-name=kmee-odoo-addons
          - --if-source-changed
          - --keep-source-digest
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.0.33
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
        args:
          - --disable=po-pretty-format
  - repo: https://github.com/myint/autoflake
    rev: v1.6.1
    hooks:
      - id: autoflake
        args:
          - --expand-star-imports
          - --ignore-init-module-imports
          - --in-place
          - --remove-all-unused-imports
          - --remove-duplicate-keys
          - --remove-unused-variables
  - repo: https://github.com/psf/black
    rev: 22.8.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: prettier
        name: prettier (with plugin-xml)
        entry: prettier
        args:
          - --write
          - --list-different
          - --ignore-unknown
        types: [text]
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|ts|xml|yaml|yml)$
        language: node
        additional_dependencies:
          - "prettier@3.3.3"
          - "@prettier/plugin-xml@3.4.1"
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint
        args:
          - --color
          - --fix
        verbose: true
        types: [javascript]
        language: node
        additional_dependencies:
          - "eslint@9.12.0"
          - "eslint-plugin-jsdoc@50.3.1"
          - "globals@16.0.0"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # exclude autogenerated files
        exclude: /README\.rst$
      - id: end-of-file-fixer
        # exclude autogenerated files
        exclude: /README\.rst$
      - id: debug-statements
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/asottile/pyupgrade
    rev: v2.38.2
    hooks:
      - id: pyupgrade
        args: ["--keep-percent-format"]
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort except __init__.py
        args:
          - --settings=.
        exclude: /__init__\.py$
  - repo: https://github.com/acsone/setuptools-odoo
    rev: 3.2.1
    hooks:
      - id: setuptools-odoo-make-default
      - id: setuptools-odoo-get-requirements
        args:
          - --output
          - requirements.txt
          - --header
          - "# generated from manifests external_dependencies"
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: flake8
        additional_dependencies: ["flake8-bugbear==21.9.2"]
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.1.3
    hooks:
      - id: pylint_odoo
        name: pylint with optional checks
        args:
          - --rcfile=.pylintrc
          - --exit-zero
        verbose: true
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc-mandatory
