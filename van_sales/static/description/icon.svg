<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9AA6B2"/>
    </marker>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#F4F7FB"/>

  <!-- Circular arrows (larger, closer to edge) -->
  <path d="M64 8 A56 56 0 0 1 120 64" fill="none" stroke="#9AA6B2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M120 64 A56 56 0 0 1 64 120" fill="none" stroke="#9AA6B2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M64 120 A56 56 0 0 1 8 64" fill="none" stroke="#9AA6B2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M8 64 A56 56 0 0 1 64 8" fill="none" stroke="#9AA6B2" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Van body -->
  <rect x="24" y="50" width="56" height="32" rx="5" fill="#5B8DEF"/>
  <!-- Van cabin -->
  <rect x="52" y="36" width="32" height="20" rx="4" fill="#5B8DEF"/>
  <!-- Windshield -->
  <rect x="56" y="40" width="24" height="12" rx="2" fill="#C8DCFF"/>

  <!-- Cargo boxes -->
  <rect x="28" y="54" width="14" height="14" rx="2" fill="#7ED6C2"/>
  <rect x="44" y="54" width="14" height="14" rx="2" fill="#5EC4AB"/>

  <!-- Wheels -->
  <circle cx="38" cy="88" r="7" fill="#2F3A4A"/>
  <circle cx="38" cy="88" r="3" fill="#6B7280"/>
  <circle cx="70" cy="88" r="7" fill="#2F3A4A"/>
  <circle cx="70" cy="88" r="3" fill="#6B7280"/>
</svg>
