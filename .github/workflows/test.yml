name: tests

on:
  pull_request:
    branches:
      - "19.0*"
  push:
    branches:
      - "19.0"
      - "19.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-ocb19.0:latest
            name: test with OCB
            makepot: "true"
            coa: "true"
            exclude: ""
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
      EXCLUDE: ${{ matrix.exclude }}
      INCLUDE: ${{ matrix.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        if: ${{ hashFiles('*/__manifest__.py') != '' }}
        run: oca_install_addons
      - name: Check licenses
        if: ${{ hashFiles('*/__manifest__.py') != '' }}
        run: manifestoo -d . check-licenses
      - name: Check development status
        if: ${{ hashFiles('*/__manifest__.py') != '' }}
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      # l10n_br_crm is the auto_install glue between l10n_br_base and crm: without it,
      # l10n_br_base puts its address view (street_name, district...) into the crm.lead
      # form while crm.lead lacks those fields, and every crm.lead Form test fails.
      - name: Install the Brazilian chart of accounts and auto_install glue used by the l10n_br dependencies
        if: ${{ matrix.coa == 'true' && hashFiles('*/__manifest__.py') != '' }}
        run: pip install --pre "odoo-addon-l10n_br_coa_generic==19.0.*" "odoo-addon-l10n_br_coa==19.0.*" "odoo-addon-l10n_br_crm==19.0.*" xsdata
      - name: Initialize test db
        if: ${{ hashFiles('*/__manifest__.py') != '' }}
        run: |
          oca_wait_for_postgres
          if [ -n "$INCLUDE" ]; then SEL="--select-include $INCLUDE"; else SEL="--select-addons-dir ."; fi
          ADDONS=$(manifestoo $SEL --select-exclude "$EXCLUDE" list-depends --separator=,)
          if [ "${{ matrix.coa }}" = "true" ]; then ADDONS="$ADDONS,l10n_br_coa_generic"; fi
          unbuffer odoo -d ${PGDATABASE} -i ${ADDONS} --http-interface=127.0.0.1 --stop-after-init | oca_checklog_odoo
      - name: Run tests
        if: ${{ hashFiles('*/__manifest__.py') != '' }}
        run: oca_run_tests
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'KMEE' }}
