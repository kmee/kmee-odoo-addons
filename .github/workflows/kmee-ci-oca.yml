# Espelho do .github/workflows/test.yml e do pre-commit.yml deste repo, no runner de casa
# (grupo kmee-casa da org). Disparo manual:
#   gh workflow run kmee-ci-oca.yml -R kmee/kmee-odoo-addons --ref 18.0 -f branch=<branch>
# Fora de proposito: codecov e atualizacao do .pot (segredos). Para a paridade nao quebrar
# em silencio, o job prep falha se o test.yml do branch testado mudou em relacao ao
# espelhado aqui (hash abaixo): atualizar este arquivo junto.
name: kmee-ci-oca

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch de kmee/kmee-odoo-addons a testar"
        required: true

permissions:
  contents: read

concurrency:
  group: kmee-ci-oca-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  prep:
    runs-on: [kmee-l10n-br]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false
      - name: "test.yml do branch igual ao espelhado"
        run: |
          H=$(sha256sum .github/workflows/test.yml | cut -d' ' -f1)
          [ "$H" = "b1aa8e294edece1dd7f7e729f55b6afbccb3c94764eba5668902e259377f773f" ] || { echo "test.yml mudou ($H): atualizar kmee-ci-oca.yml"; exit 1; }
      - name: Unreleased dependencies (como o job da OCA)
        run: |
          for f in requirements.txt test-requirements.txt; do
            [ -f "$f" ] || continue
            if grep -q '^[^#].*/' "$f"; then echo "Unreleased dependencies found in $f."; exit 1; fi
          done

  pre-commit:
    needs: prep
    runs-on: [kmee-l10n-br]
    timeout-minutes: 30
    container: python:3.11-bookworm
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && pip install -q pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: oca-gen-addon-readme
      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then echo "Please check-in the following files:"; echo "$newfiles"; exit 1; fi

  test:
    needs: prep
    runs-on: [kmee-l10n-br]
    timeout-minutes: 180
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test with OCB
            coa: "true"
            exclude: "mrp_multi_level_product_area_creator"
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test mrp modules
            coa: "false"
            include: "mrp_multi_level_product_area_creator"
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
      EXCLUDE: ${{ matrix.exclude }}
      INCLUDE: ${{ matrix.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Install the Brazilian chart of accounts and auto_install glue used by the l10n_br dependencies
        if: ${{ matrix.coa == 'true' }}
        run: pip install --pre "odoo-addon-l10n_br_coa_generic==18.0.*" "odoo-addon-l10n_br_coa==18.0.*" "odoo-addon-l10n_br_crm==18.0.*" xsdata
      - name: Initialize test db
        run: |
          oca_wait_for_postgres
          if [ -n "$INCLUDE" ]; then SEL="--select-include $INCLUDE"; else SEL="--select-addons-dir ."; fi
          ADDONS=$(manifestoo $SEL --select-exclude "$EXCLUDE" list-depends --separator=,)
          if [ "${{ matrix.coa }}" = "true" ]; then ADDONS="$ADDONS,l10n_br_coa_generic"; fi
          unbuffer odoo -d ${PGDATABASE} -i ${ADDONS} --http-interface=127.0.0.1 --stop-after-init | oca_checklog_odoo
      - name: Run tests
        run: oca_run_tests
